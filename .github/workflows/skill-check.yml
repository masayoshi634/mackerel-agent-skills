name: skill-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  skill-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      # shellcheck / jq / python3 はランナーに同梱。claude CLI は入れないので plugin validate はスキップされる
      - name: skill-check
        run: make skill-check
